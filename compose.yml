name: aquasensus

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AQS_DB_USER:-aquasensus}
      POSTGRES_PASSWORD: ${AQS_DB_PASSWORD:-aquasensus}
      POSTGRES_DB: ${AQS_DB_NAME:-aquasensus}
    volumes:
      - aqs_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AQS_DB_USER:-aquasensus} -d ${AQS_DB_NAME:-aquasensus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  core:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    environment:
      AQS_DB_URL: jdbc:postgresql://db:5432/${AQS_DB_NAME:-aquasensus}
      AQS_DB_USER: ${AQS_DB_USER:-aquasensus}
      AQS_DB_PASSWORD: ${AQS_DB_PASSWORD:-aquasensus}
      AQS_JWT_SECRET: ${AQS_JWT_SECRET:-dev-only-change-me-32-octets-min!!}
      AQS_ADMIN_PASSWORD: ${AQS_ADMIN_PASSWORD:-ChangeMoi!2026}
      AQS_INTERNAL_SECRET: ${AQS_INTERNAL_SECRET:-dev-internal-secret-change-me}
      AQS_CORS_ORIGINS: ${AQS_CORS_ORIGINS:-http://localhost:4200,http://localhost}
      SPRING_PROFILES_ACTIVE: ${AQS_PROFILE:-dev}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 768M

  data:
    build:
      context: ./data-python
      dockerfile: Dockerfile
    environment:
      AQS_CORE_URL: http://core:8080
      AQS_INTERNAL_SECRET: ${AQS_INTERNAL_SECRET:-dev-internal-secret-change-me}
    depends_on:
      core:
        condition: service_healthy
    expose:
      - "8090"
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 64M

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/${AQS_NGINX_CONF:-dev}.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      core:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  aqs_pg:
