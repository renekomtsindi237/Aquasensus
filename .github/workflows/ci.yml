name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Tests cœur métier + JaCoCo
        working-directory: backend-java
        run: sh ./mvnw -B test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests data
        working-directory: data-python
        run: |
          pip install -r requirements.txt
          pytest -q --cov=aquasensus_data --cov-fail-under=70

  angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Tests PWA
        working-directory: frontend-angular
        run: |
          npm ci
          npx ng test --no-watch --browsers=ChromeHeadless
          npx playwright install --with-deps chromium
          npx playwright test
